<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurora — focus-mode (Nocturne / dark)</title>
<link rel="stylesheet" href="aurora.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Focus = chrome retiré : pas de TopBar, BottomNav masqué (05 §4.4.2).
   Écran qui respire : fond Nocturne + halo radial très doux derrière le ring. */
.frame{background:radial-gradient(120% 90% at 50% 38%,#111A30 0%,#121212 62%,#070A14 100%)}
.content{display:flex;flex-direction:column;padding-bottom:20px}
.callout.info{background:rgba(56,189,248,.12);color:#7DD3FC}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.ring{position:relative;width:208px;height:208px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:#25282F;stroke-width:8}
.ring .arc{fill:none;stroke:url(#grad);stroke-width:8;stroke-linecap:round}
.ring .time{font-size:40px;font-weight:500;color:#F1F5F9;letter-spacing:-1px}
.ring .lab{position:absolute;bottom:44px;font-size:13px;color:#94A3B8;font-weight:500}
.ring .lab b{color:#F1F5F9;font-weight:600}
/* dark overrides for this screen */
body{background:#05070F}
.seg{background:rgba(27,36,56,.7);border:1px solid #334155}
.seg button{color:#94A3B8}
.seg button.on{background:#1E2026;color:#60A5FA;box-shadow:none;border:1px solid #334155}
.footer{display:flex;align-items:center;justify-content:space-between;padding:0 8px;margin-top:26px}
.btn-outline{border-color:#334155;color:#E2E8F0;background:rgba(27,36,56,.5)}
.kv{width:100%;margin-top:22px;background:rgba(21,28,44,.65);border:1px solid #263248;border-radius:16px;padding:6px 14px}
.kv .li-title{color:#F1F5F9}.kv .li-sub{color:#64748B}
.kv .listitem{border-color:#263248}
</style>
</head>
<body>
<div class="frame" style="border-color:#1E293B">
  <div class="safe content">
    <!-- callout info (seul chrome) -->
    <div class="callout info" style="margin-top:6px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      <div style="flex:1"><strong style="font-weight:600">Notifications réduites</strong> pour cette session</div>
    </div>

    <div class="center">
      <!-- FocusTimer ring 160px core (05 §3.6.9) -->
      <div class="ring">
        <svg width="208" height="208" viewBox="0 0 208 208">
          <defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3678F6"/><stop offset="1" stop-color="#22C7D6"/></linearGradient></defs>
          <circle class="track" cx="104" cy="104" r="94"/>
          <circle class="arc" cx="104" cy="104" r="94" stroke-dasharray="590" stroke-dashoffset="220"/>
        </svg>
        <div style="text-align:center">
          <div class="mono time">18:42</div>
          <div style="font-size:12px;color:#64748B;margin-top:2px" class="mono">pomodoro 25 min</div>
        </div>
        <div class="lab"><b>Slides de soutenance</b> · bloc 2/3</div>
      </div>

      <!-- mode de session -->
      <div class="seg" style="width:260px;margin-top:26px">
        <button class="on">Pomodoro</button><button>Temps libre</button>
      </div>

      <!-- tâches associées -->
      <div class="kv">
        <div class="listitem">
          <div class="li-body"><div class="li-title">Préparer les slides</div><div class="li-sub mono">2/4 sous-tâches · 12 min</div></div>
          <span class="badge" style="background:rgba(54,120,246,.2);color:#60A5FA">focus</span>
        </div>
        <div class="listitem" style="border-bottom:0">
          <div class="li-body"><div class="li-title">Relire la Q&amp;A</div><div class="li-sub mono">bloqué</div></div>
          <span class="badge" style="background:rgba(248,113,113,.16);color:#F87171">bloqué</span>
        </div>
      </div>
    </div>

    <!-- footer : Terminer (ghost) + Démarrer (primary, seul CTA) -->
    <div class="footer">
      <button class="btn btn-outline focus-ring" style="height:48px;padding:0 16px" aria-label="Terminer la session"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></button>
      <button class="btn btn-primary focus-ring" style="height:56px;padding:0 28px;font-size:15px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 4l14 8-14 8V4z"/></svg> Reprendre</button>
    </div>
  </div>
</div>
<span class="pill-label" style="color:#94A3B8"><span class="dot" style="background:var(--primary)"></span>Focus mode · <span style="color:#64748B">Nocturne (dark)</span> <span class="route">/focus</span></span>
</body>
</html>
