<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurora — knowledge-tree</title>
<link rel="stylesheet" href="aurora.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
.tree{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:auto;box-shadow:var(--shadow-1);flex:1;min-height:400px}
.tree svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tnode{position:absolute;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:9px 12px;font-size:12.5px;font-weight:600;color:var(--text-1);display:flex;align-items:center;gap:7px;box-shadow:var(--shadow-1);cursor:pointer;white-space:nowrap}
.tnode .d{width:8px;height:8px;border-radius:50%}
.tnode.active{border-color:var(--primary);background:var(--sel-surface);color:var(--primary-600);box-shadow:0 0 0 3px rgba(54,120,246,.15)}
.tnode.mastered .d{background:var(--node-mastered)}
.tnode.fragile .d{background:var(--node-fragile)}
.tnode.forgotten .d{background:var(--node-forgotten)}
.toolbar{display:flex;gap:8px;margin-bottom:12px}
.toolbar .seg{flex:1}
</style>
</head>
<body>
<div class="frame">
  <div class="safe content" style="display:flex;flex-direction:column">
    <div class="topbar" style="padding-top:0">
      <h1 style="font-size:18px">Connaissances</h1>
      <div style="display:flex;gap:4px">
        <button class="iconbtn focus-ring" aria-label="Zoom +"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M20 20l-3.5-3.5"/></svg></button>
        <button class="iconbtn focus-ring" aria-label="Recentrer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg></button>
      </div>
    </div>

    <div class="toolbar">
      <div class="seg">
        <button class="on">Arbre</button><button>Carte</button><button class="mono" style="font-size:11px">96 nœuds</button>
      </div>
    </div>

    <!-- Semantic tree (AD-10) : niveau 1 lazy, nœuds 100×38 -->
    <div class="tree">
      <svg aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%">
        <g stroke="var(--text-2)" stroke-opacity=".3" stroke-width="1.4" stroke-linecap="round" fill="none">
          <path d="M195 78 C 150 78, 150 120, 110 120"/>
          <path d="M195 78 C 240 78, 240 120, 280 120"/>
          <path d="M195 78 C 195 78, 195 150, 195 150"/>
          <path d="M110 120 C 70 120, 70 175, 60 175"/>
          <path d="M110 120 C 150 120, 150 175, 165 175"/>
          <path d="M280 120 C 320 120, 320 175, 320 175"/>
          <path d="M280 120 C 240 120, 240 240, 230 240"/>
          <path d="M165 175 C 130 175, 130 230, 120 230"/>
          <path d="M165 175 C 200 175, 200 230, 210 230"/>
        </g>
      </svg>
      <!-- root -->
      <div class="tnode mastered" style="left:150px;top:52px;width:150px;justify-content:center;border-color:var(--node-mastered);background:var(--success-surface)"><span class="d"></span>Mécanique</div>
      <!-- level 1 -->
      <div class="tnode fragile" style="left:24px;top:148px;width:132px"><span class="d"></span>Cinématique</div>
      <div class="tnode mastered" style="left:176px;top:148px;width:132px"><span class="d"></span>Statique</div>
      <div class="tnode active" style="left:248px;top:148px;width:118px"><span class="d"></span>Thermodynamique</div>
      <!-- level 2 -->
      <div class="tnode forgotten" style="left:10px;top:208px;width:128px"><span class="d"></span>Mouvement 1D</div>
      <div class="tnode mastered" style="left:120px;top:208px;width:128px"><span class="d"></span>Travail énergie</div>
      <div class="tnode fragile" style="left:232px;top:208px;width:112px"><span class="d"></span>Équations</div>
      <div class="tnode fragile" style="left:130px;top:270px;width:112px"><span class="d"></span>1ᵉʳ principe</div>
      <div class="tnode forgotten" style="left:242px;top:270px;width:120px"><span class="d"></span>Entropie</div>
      <!-- lazy deeper indicator -->
      <div class="tnode" style="left:310px;top:320px;width:80px;background:var(--bg-subtle);border-style:dashed;color:var(--text-muted);font-weight:500">+ 42 …</div>
    </div>

    <div style="display:flex;gap:10px;margin-top:12px;font-size:11px;color:var(--text-muted)">
      <span style="display:flex;align-items:center;gap:5px"><i class="d" style="width:8px;height:8px;border-radius:50%;background:var(--node-mastered);display:inline-block"></i>Maîtrisé</span>
      <span style="display:flex;align-items:center;gap:5px"><i class="d" style="width:8px;height:8px;border-radius:50%;background:var(--node-fragile);display:inline-block"></i>Fragile</span>
      <span style="display:flex;align-items:center;gap:5px"><i class="d" style="width:8px;height:8px;border-radius:50%;background:var(--node-forgotten);display:inline-block"></i>Oublié</span>
    </div>
  </div>
  <nav class="bottomnav">
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h8"/></svg>Tâches</button>
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Apprendre</button>
    <button class="on"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M3 3v18h18"/><path d="m7 14 3-3 3 3 5-5"/></svg>Progression</button>
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 8V4M8 8l2-2M16 8l-2-2"/><circle cx="12" cy="14" r="6"/></svg>Coach</button>
  </nav>
</div>
<span class="pill-label"><span class="dot"></span>Arbre sémantique <span class="route">/knowledge</span></span>
</body>
</html>
